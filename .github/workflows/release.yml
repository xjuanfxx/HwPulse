# Publica una release al subir un tag vX.Y.Z:
#   git tag v0.1.2 && git push origin v0.1.2
# Compila el .exe portable (lo que usa el auto-update), su SHA-256 y un zip con la versión en carpeta.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.2). It is created on the selected branch if it doesn't exist."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # etiquetas e historial: para el enlace "Full Changelog" con la versión anterior

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Version from tag
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Tag must look like v1.2.3, got '$env:TAG'" }
          "VERSION=$($Matches[1])" | Out-File $env:GITHUB_ENV -Append

      - name: Publish single-file exe
        shell: pwsh
        run: >
          dotnet publish HwPulse.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:Version=$env:VERSION -o out/single

      - name: Publish folder build
        shell: pwsh
        run: >
          dotnet publish HwPulse.csproj -c Release -r win-x64 --self-contained false
          -p:PublishReadyToRun=true -p:Version=$env:VERSION -o out/folder

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item out/single/HwPulse.exe dist/HwPulse.exe
          $hash = (Get-FileHash dist/HwPulse.exe -Algorithm SHA256).Hash
          "$hash  HwPulse.exe" | Out-File dist/HwPulse.exe.sha256 -Encoding ascii -NoNewline
          Remove-Item out/folder/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive out/folder/* "dist/HwPulse-$env:VERSION-win-x64.zip"
          "HASH=$hash" | Out-File $env:GITHUB_ENV -Append

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notas de la versión: la sección "## [X.Y.Z]" de CHANGELOG.md (hasta la siguiente versión).
          $changelog = Get-Content CHANGELOG.md -Raw -ErrorAction SilentlyContinue
          $pattern = '(?ms)^## \[' + [regex]::Escape($env:VERSION) + '\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)'
          $section = if ($changelog -and $changelog -match $pattern) { $Matches[1].Trim() } else { "" }
          if (-not $section) { Write-Host "::warning::CHANGELOG.md has no section for $env:VERSION; publishing install notes only." }

          $install = @"
          ## Install / Instalación
          1. Install the [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) (x64) · Instala el .NET 10 Desktop Runtime (x64).
          2. Download ``HwPulse.exe`` and run it (it asks for administrator rights for the sensor driver and FPS capture) · Descarga ``HwPulse.exe`` y ábrelo (pide administrador para el driver de sensores y la captura de FPS).

          ``HwPulse-$env:VERSION-win-x64.zip`` is the same app as a folder, in case your antivirus dislikes the single file · es la misma app en carpeta, por si tu antivirus desconfía del archivo único.

          **Already installed? / ¿Ya la tienes?** HwPulse 0.1.3+ shows an update notice at the top of the window · HwPulse 0.1.3 o posterior muestra un aviso de actualización arriba de la ventana.

          SHA-256 ``HwPulse.exe``: ``$env:HASH``
          "@
          $prev = git tag --sort=-v:refname | Where-Object { $_ -ne $env:TAG } | Select-Object -First 1
          $compare = if ($prev) { "`n`n**Full Changelog**: https://github.com/${{ github.repository }}/compare/$prev...$env:TAG" } else { "" }
          $notes = if ($section) { "$section`n`n---`n`n$install$compare" } else { "$install$compare" }
          $notes | Out-File notes.md -Encoding utf8
          gh release create $env:TAG dist/* --title "HwPulse $env:VERSION" --notes-file notes.md --target $env:GITHUB_SHA
